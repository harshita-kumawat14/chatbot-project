<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot</title>
</head>
<body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>
    <script type="text/babel">
        function ChatInput({chatMessages,setChatMessage}){
            const[inputText,setInputText]= React.useState('');
            function saveInputText(event){
             setInputText(event.target.value) ;
            }
            function sendMesage(){
                const newChat=[
                ...chatMessages,
                {
                    message:inputText,
                    sender:'user',
                    id:crypto.randomUUID()
                }
                ]
                setChatMessage(newChat);
               const response= Chatbot.getResponse(inputText);
               setChatMessage([
                ...newChat,
                {
                    message:response,
                    sender:'robot',
                    id:crypto.randomUUID()
                }
                ]);
                setInputText('');
            }
            return (
                <>
                    <input 
                        placeholder="Send a message to Chatbot " 
                        size="30" 
                        onChange={saveInputText} 
                        value={inputText}
                    />
                    <button 
                        onClick={sendMesage}
                    >send</button>
                    </>
            );

        }
        function ChatMessage({message,sender}){
            // const message=props.message;
            // let sender=props.sender;
            // let {message,sender}=props;
            //  if(sender==="robot"){ 
            //     return (
            //     <div>
            //         <img src="rob.jpg" height="50" width="50" />
            //         {message}
               
            //     </div>
            //     );
                    
            //     }
            //     else if(sender==="user"){
            //         return (
            //         <div>
            //           {message}
            //         <img src="user1.png" height="50" width="50" />
            //         </div>
            //         );
            //     }
            return(
                <div> 
               {sender==='robot' && <img src="rob.jpg" height="50" width="50" />}
                {message}
                {sender=='user'&& <img src="user1.png" height="50" width="50" />}
                
                </div>
            );
        }
        function ChatMessages({chatMessages}){
          
        return ( 
            <>
                {chatMessages.map((chatMessage)=>{
                  return(
                <ChatMessage 
                    message={chatMessage.message}
                    sender={chatMessage.sender} 
                    key={chatMessage.id} 
                />
                );})
                }
            </>  
        );
    }
      
        function App(){ 
            const [chatMessages,setChatMessage]= React.useState(
                [
            {
                message:'hello chatbot',
                sender:'user',
                id:'id1'
            },
            { 
                message:'hello! how can I help you?',
                sender:'robot',
                id:'id2'
            },
           {
                message:'can you get me toadys date?',
                sender:'user',
                id:'id3'
           } ,
           {
                message:'today is sept 30',
                sender:'robot',
                id:'id4'
           }
        ]
            )
        
            return(                                                                                       
            <>
            <ChatInput 
            chatMessages={chatMessages}
            setChatMessage={setChatMessage}
            />
            <ChatMessages
            chatMessages={chatMessages}
             />
            
            </>
        );}
           
        const container=document.querySelector('.js-container');
        let Root=ReactDOM.createRoot(container);
        Root.render(<App />);
         </script>
</body>
</html>
