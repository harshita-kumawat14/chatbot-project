       function ProductDetails({Name,price,discountPrice,imageSrc}){
        return(
          <div>
           <img src={imageSrc} width="150" />
            <p>{Name}</p>
            {discountPrice ?  (<>
                <del><p>Price:${price}</p></del>
                <p>Discount Price: ${discountPrice}</p>
                </>
            ): (<p>Price:${price}</p>
                )}
            <button>Add to cart</button>
          </div>
        );
       }
       function App(){
        return (
            <>
            <ProductDetails 
            Name="Cotton Socks"
            price="10.90"
            discountPrice="5.45"
            imageSrc="cotton-socks.jpg"
            />
            <ProductDetails 
            Name="Tennis balls"
            price="6.00"
            discountPrice="5.00"
            imageSrc="tennis-balls.webp"
            />
            <ProductDetails 
            Name="Tshirt"
            price="7.99"
            imageSrc="plain-t-shirt.png"
            />
            
            </>
        );
       }
       const container=document.querySelector('.js-container');
        let Root=ReactDOM.createRoot(container);
        Root.render(<App />);
    </script>
